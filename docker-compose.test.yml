name: geoflow-test

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: geoflow-postgres-test
    volumes:
      - ./docker-data/test/postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: geoflow-redis-test

  init:
    image: geoflow-app-test:latest
    container_name: geoflow-init-test
    env_file:
      - ./.env.test
    volumes:
      - ./.env.test:/var/www/html/.env
      - ./docker-data/test/storage:/var/www/html/storage

  app:
    image: geoflow-app-test:latest
    container_name: geoflow-app-test
    volumes:
      - ./.env.test:/var/www/html/.env
      - ./docker-data/test/storage:/var/www/html/storage

  web:
    image: geoflow-web-test:latest
    container_name: geoflow-web-test
    ports:
      - "18082:80"
    volumes:
      - ./docker-data/test/storage:/var/www/html/storage:ro

  queue:
    image: geoflow-app-test:latest
    container_name: geoflow-queue-test
    volumes:
      - ./.env.test:/var/www/html/.env
      - ./docker-data/test/storage:/var/www/html/storage

  scheduler:
    image: geoflow-app-test:latest
    container_name: geoflow-scheduler-test
    volumes:
      - ./.env.test:/var/www/html/.env
      - ./docker-data/test/storage:/var/www/html/storage

  reverb:
    image: geoflow-app-test:latest
    container_name: geoflow-reverb-test
    ports:
      - "18083:18080"
    volumes:
      - ./.env.test:/var/www/html/.env
      - ./docker-data/test/storage:/var/www/html/storage

networks:
  default:
    name: geoflow-test-net
    ipam:
      config:
        - subnet: 10.89.0.0/16
          gateway: 10.89.0.1

volumes:
  geoflow-redis-prod-data:
    name: geoflow-redis-test-data
